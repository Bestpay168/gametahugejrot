<svg xmlns="http://www.w3.org/2000/svg"
     width="256"
     height="256"
     viewBox="0 0 256 256">

  <defs>
    <linearGradient id="brownBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8793F"/>
      <stop offset="100%" stop-color="#6D3F1E"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6"
                    flood-color="#000"
                    flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Bayangan -->
  <ellipse cx="128"
           cy="220"
           rx="70"
           ry="16"
           fill="#000"
           opacity="0.15"/>

  <!-- Kotak -->
  <rect x="48"
        y="40"
        width="160"
        height="160"
        rx="18"
        fill="url(#brownBox)"
        filter="url(#shadow)"/>

  <!-- Garis atas -->
  <rect x="48"
        y="40"
        width="160"
        height="24"
        rx="18"
        fill="#D89A5A"
        opacity="0.7"/>

  <!-- Garis tengah -->
  <line x1="128"
        y1="40"
        x2="128"
        y2="200"
        stroke="#5B3216"
        stroke-width="4"/>

  <line x1="48"
        y1="120"
        x2="208"
        y2="120"
        stroke="#5B3216"
        stroke-width="4"/>

  <!-- Kilau -->
  <path d="M70 60
           Q95 45 120 60"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.4"/>

</svg>